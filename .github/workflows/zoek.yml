name: Zoek auto's
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths: ["zoek.py", "config.json", "docs/index.html"]
permissions:
  contents: write
concurrency: zoek
jobs:
  zoek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 zoek.py
      - name: Opslaan
        run: |
          git config user.name "zoek-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || (git commit -m "Data bijgewerkt" && git pull --rebase -X theirs && git push)
