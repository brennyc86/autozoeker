<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camper-auto zoeker</title>
<style>
:root{--bg:#f4f6f8;--kaart:#fff;--tekst:#1d2733;--zacht:#5d6b7a;--rand:#dde3ea;--accent:#0b6bcb;--goed:#1a7f37;--slecht:#c62828;--let:#b26a00}
@media(prefers-color-scheme:dark){:root{--bg:#0f1720;--kaart:#18222e;--tekst:#e7edf3;--zacht:#93a1b1;--rand:#2a3746;--accent:#5aa9ff;--goed:#4cc26b;--slecht:#ff7b72;--let:#e3a008}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tekst);font:15px/1.4 system-ui,sans-serif}
header{padding:16px;max-width:1100px;margin:auto}
h1{margin:0 0 4px;font-size:22px}
.sub{color:var(--zacht);font-size:13px}
main{max-width:1100px;margin:auto;padding:0 16px 40px}
.filters{background:var(--kaart);border:1px solid var(--rand);border-radius:10px;padding:12px;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:12px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--zacht)}
select,input[type=search],input[type=number]{padding:7px;border:1px solid var(--rand);border-radius:6px;background:var(--bg);color:var(--tekst);font:inherit}
.vink{flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--tekst)}
.tel{margin:8px 0;color:var(--zacht);font-size:13px}
.lijst{display:grid;gap:10px}
.auto{display:grid;grid-template-columns:120px 1fr auto;gap:12px;background:var(--kaart);border:1px solid var(--rand);border-radius:10px;padding:10px;text-decoration:none;color:inherit}
.auto:hover{border-color:var(--accent)}
.foto{width:120px;height:90px;object-fit:cover;border-radius:6px;background:var(--rand)}
.titel{font-weight:600;margin-bottom:3px}
.meta{color:var(--zacht);font-size:13px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.b{font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid var(--rand);white-space:nowrap}
.b.goed{color:var(--goed);border-color:var(--goed)}.b.slecht{color:var(--slecht);border-color:var(--slecht)}.b.let{color:var(--let);border-color:var(--let)}.b.nw{background:var(--accent);color:#fff;border-color:var(--accent)}
.prijs{text-align:right;font-weight:700;font-size:19px;white-space:nowrap}
.prijs small{display:block;font-weight:400;color:var(--zacht);font-size:11px}
.tekst{font-size:12px;color:var(--zacht);margin-top:5px}
a.ook{font-size:12px;color:var(--accent)}
@media(max-width:600px){.auto{grid-template-columns:90px 1fr}.foto{width:90px;height:70px}.prijs{grid-column:1/-1;text-align:left}}
</style>
</head>
<body>
<header>
  <h1>🚐 Camper-auto zoeker</h1>
  <div class="sub" id="status">Laden…</div>
</header>
<main>
  <div class="filters">
    <label>Zoek in tekst<input type="search" id="q" placeholder="bijv. airco, schuifdeur"></label>
    <label>Model<select id="model"><option value="">Alle modellen</option></select></label>
    <label>Bron<select id="bron"><option value="">Alle sites</option><option>Marktplaats</option><option>AutoScout24</option></select></label>
    <label>Max. prijs (€)<input type="number" id="maxp" value="1000" step="100" min="0"></label>
    <label>APK minimaal nog geldig<select id="apkmin"><option value="">maakt niet uit</option><option value="0">niet verlopen</option><option value="3">≥ 3 maanden</option><option value="6">≥ 6 maanden</option><option value="12">≥ 12 maanden</option></select></label>
    <label>Max. km<input type="number" id="maxkm" placeholder="geen limiet" step="10000"></label>
    <label>Sorteer<select id="sort"><option value="prijs">Prijs (laag → hoog)</option><option value="km">Kilometers (laag → hoog)</option><option value="jaar">Bouwjaar (nieuw → oud)</option><option value="nieuw">Nieuwst gevonden</option></select></label>
    <div>
      <label class="vink"><input type="checkbox" id="grijs"> toon ook vermoedelijk grijs kenteken (bestel)</label>
      <label class="vink"><input type="checkbox" id="exp"> toon export/Duits/Belgisch</label>
      <label class="vink"><input type="checkbox" id="twijfel"> toon onduidelijke prijs (€1, bieden)</label>
    </div>
  </div>
  <div class="tel" id="tel"></div>
  <div class="lijst" id="lijst"></div>
</main>
<script>
const $=id=>document.getElementById(id);
let data=null;
const euro=n=>"€ "+n.toLocaleString("nl-NL");
function apkMaanden(apk){ // 'YYYY-MM' -> maanden vanaf nu (einde van die maand)
  if(!apk) return null;
  const [j,m]=apk.split("-").map(Number), nu=new Date();
  return (j-nu.getFullYear())*12+(m-(nu.getMonth()+1));
}
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){
  const q=$("q").value.toLowerCase(), mo=$("model").value, br=$("bron").value, mp=+$("maxp").value||1e9,
        am=$("apkmin").value, mk=+$("maxkm").value||1e9, so=$("sort").value;
  let l=data.auto.filter(a=>
    a.prijs<=mp && a.km<=mk && (!mo||a.model===mo) && (!br||a.bron===br||(a.ook_op||[]).some(o=>o.bron===br)) &&
    ($("grijs").checked||!a.grijs) && ($("exp").checked||!a.export) && ($("twijfel").checked||!a.prijs_twijfel) &&
    (!q||(a.titel+" "+a.tekst+" "+a.plaats).toLowerCase().includes(q)) &&
    (am===""||(apkMaanden(a.apk)!==null&&apkMaanden(a.apk)>=+am)));
  const nu=Date.now();
  l.sort((a,b)=>so==="prijs"?a.prijs-b.prijs:so==="km"?a.km-b.km:so==="jaar"?b.jaar-a.jaar:(b.eerst_gezien>a.eerst_gezien?1:-1));
  $("tel").textContent=l.length+" auto's gevonden";
  $("lijst").innerHTML=l.map(a=>{
    const am=apkMaanden(a.apk), badges=[];
    const dagen=(nu-new Date(a.eerst_gezien))/864e5;
    if(dagen<=2) badges.push('<span class="b nw">nieuw</span>');
    if(a.apk) badges.push(`<span class="b ${am<0?"slecht":am<4?"let":"goed"}">APK ${a.apk}${am<0?" (verlopen)":""}</span>`);
    else badges.push('<span class="b">APK onbekend</span>');
    if(a.grijs) badges.push('<span class="b slecht">grijs kenteken?</span>');
    if(a.export) badges.push('<span class="b slecht">export/buitenlands</span>');
    if(a.marge) badges.push('<span class="b let">marge</span>');
    if(a.prijs_twijfel) badges.push('<span class="b let">prijs onduidelijk</span>');
    if(a.vorige_prijs) badges.push(`<span class="b goed">prijs was ${euro(a.vorige_prijs)}</span>`);
    if(a.type_verkoper) badges.push(`<span class="b">${a.type_verkoper}</span>`);
    const ook=(a.ook_op||[]).map(o=>`<a class="ook" href="${esc(o.url)}" target="_blank" rel="noopener">ook op ${esc(o.bron)}</a>`).join(" · ");
    return `<a class="auto" href="${esc(a.url)}" target="_blank" rel="noopener">
      <img class="foto" loading="lazy" src="${esc(a.foto)}" alt="" onerror="this.style.visibility='hidden'">
      <div><div class="titel">${esc(a.titel)}</div>
        <div class="meta">${a.jaar||"?"} · ${a.km?a.km.toLocaleString("nl-NL")+" km":"km onbekend"} · ${esc(a.brandstof)} · ${esc(a.plaats)} · ${esc(a.bron)}</div>
        <div class="badges">${badges.join("")}</div>
        ${a.tekst?`<div class="tekst">${esc(a.tekst)}</div>`:""}
        ${ook?`<div class="tekst">${ook}</div>`:""}</div>
      <div class="prijs">${a.prijs<100?"?":euro(a.prijs)}<small>${esc(a.prijstype)}</small></div></a>`}).join("")||'<p class="meta">Niets gevonden met deze filters.</p>';
}
fetch("data.json?"+Date.now()).then(r=>r.json()).then(d=>{
  data=d;
  [...new Set(d.auto.map(a=>a.model))].sort().forEach(m=>$("model").add(new Option(m,m)));
  const t=new Date(d.bijgewerkt);
  $("status").textContent="Laatst bijgewerkt: "+t.toLocaleString("nl-NL",{dateStyle:"medium",timeStyle:"short"})+" · "+Object.entries(d.bronnen).map(([k,v])=>k+": "+v).join(" · ")+" · wordt elk uur ververst";
  document.querySelectorAll("input,select").forEach(e=>e.addEventListener("input",render));
  render();
}).catch(e=>{$("status").textContent="Kon data.json niet laden: "+e});
</script>
</body>
</html>
